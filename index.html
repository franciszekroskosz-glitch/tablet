<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

body {
    text-align: center;
}

#clock {
    font-size: 200px;
    font-weight: bold;
    margin-top: 20px;
}

#date {
    font-size: 65px;
    margin: 10px 0 20px 0;
    color: #dddddd;
}

.weather {
    width: 100%;
    height: 350px;
    border: none;
    display: block;
}
</style>
</head>

<body>

<div id="clock"></div>
<div id="date"></div>

<iframe
    class="weather"
    src="https://indify.co/widgets/live/weather/CdClu33HVSTxNfdyYG5s">
</iframe>

<script>
function updateClock() {
    var d = new Date();

    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();

    if (h < 10) h = "0" + h;
    if (m < 10) m = "0" + m;
    if (s < 10) s = "0" + s;

    document.getElementById("clock").innerHTML =
        h + ":" + m + ":" + s;

    var dni = [
        "Niedziela",
        "Poniedziałek",
        "Wtorek",
        "Środa",
        "Czwartek",
        "Piątek",
        "Sobota"
    ];

    var miesiace = [
        "stycznia",
        "lutego",
        "marca",
        "kwietnia",
        "maja",
        "czerwca",
        "lipca",
        "sierpnia",
        "września",
        "października",
        "listopada",
        "grudnia"
    ];

    document.getElementById("date").innerHTML =
        dni[d.getDay()] + ", " +
        d.getDate() + " " +
        miesiace[d.getMonth()] + " " +
        d.getFullYear();
}

updateClock();
setInterval(updateClock, 1000);

document.body.onclick = function() {

    var el = document.documentElement;

    if (el.requestFullscreen) {
        el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
    } else if (el.mozRequestFullScreen) {
        el.mozRequestFullScreen();
    }

    document.body.onclick = null;
};
</script>

</body>
</html>
