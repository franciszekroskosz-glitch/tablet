<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

#clock{
    font-size:60px;
    margin:20px 0;
}
</style>
</head>

<body>

<div id="clock"></div>

<iframe
src="https://indify.co/widgets/live/weather/CdClu33HVSTxNfdyYG5s"
width="420"
height="280"
style="border:none;">
</iframe>

<script>
function zegar() {
  var teraz = new Date();

  var godz = teraz.getHours();
  var min = teraz.getMinutes();
  var sek = teraz.getSeconds();

  if(godz < 10) godz = "0" + godz;
  if(min < 10) min = "0" + min;
  if(sek < 10) sek = "0" + sek;

  document.getElementById("clock").innerHTML =
    godz + ":" + min + ":" + sek;
}

zegar();
window.setInterval(zegar,1000);
</script>

</body>
</html>
